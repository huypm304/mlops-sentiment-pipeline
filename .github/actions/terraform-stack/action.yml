name: Terraform Stack
description: Init, validate, plan, apply, or destroy a bootstrap/core/runtime stack

inputs:
  stack:
    description: bootstrap | core | runtime
    required: true
  command:
    description: fmt-check | validate | plan | apply | destroy
    required: true
  auto_approve:
    description: Skip interactive approval for apply/destroy
    required: false
    default: "true"
  domain_name:
    description: Root domain for core (Route53 zone) and runtime (ACM/CloudFront/API)
    required: false
    default: ""
  enable_custom_domain:
    description: Runtime — enable Route53 records, ACM, and CloudFront frontend
    required: false
    default: "false"
  api_subdomain:
    description: Runtime — API subdomain prefix (api → api.minhhuy.me)
    required: false
    default: "api"
  enable_sagemaker_endpoint:
    description: Runtime — create SageMaker inference endpoint
    required: false
    default: "false"
  enable_sagemaker_training:
    description: Runtime — wire SageMaker training jobs in pipeline
    required: false
    default: "false"
  enable_eventbridge_monitoring:
    description: Runtime — EventBridge monitoring schedules
    required: false
    default: "true"
  sagemaker_instance_type:
    description: Runtime only — SageMaker endpoint instance type when endpoint is enabled
    required: false
    default: "ml.m5.large"
  model_package_version:
    description: Runtime — bump when models/production/model.tar.gz changes (forces SageMaker redeploy)
    required: false
    default: "v3"

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false

    - name: Verify AWS credentials secrets
      if: inputs.command != 'fmt-check' && inputs.command != 'validate'
      shell: bash
      run: |
        if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
          echo "::error::Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitHub Secrets (repository or environment demo)."
          exit 1
        fi

    - name: Configure AWS credentials
      if: inputs.command != 'fmt-check' && inputs.command != 'validate'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform fmt (check)
      if: inputs.command == 'fmt-check'
      shell: bash
      run: terraform fmt -check -recursive
      working-directory: infra

    - name: Build Lambda bundles
      if: inputs.stack == 'runtime' && inputs.command != 'fmt-check'
      shell: bash
      run: bash scripts/build_audit_lambda.sh

    - name: Terraform init
      if: inputs.command != 'fmt-check'
      shell: bash
      working-directory: infra/${{ inputs.stack }}
      run: |
        set -euo pipefail
        if [[ "${{ inputs.stack }}" == "bootstrap" ]]; then
          terraform init -input=false
        else
          if [[ -z "${TF_STATE_BUCKET:-}" ]]; then
            echo "::error::Variable TF_STATE_BUCKET is not set. Run deploy-bootstrap first."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
        fi

    - name: Terraform validate
      if: inputs.command == 'validate' || inputs.command == 'plan' || inputs.command == 'apply' || inputs.command == 'destroy'
      shell: bash
      working-directory: infra/${{ inputs.stack }}
      run: terraform validate

    - name: Terraform plan
      if: inputs.command == 'plan'
      shell: bash
      working-directory: infra/${{ inputs.stack }}
      run: |
        EXTRA_ARGS=()
        if [[ "${{ inputs.stack }}" == "runtime" ]]; then
          EXTRA_ARGS+=(
            -var="enable_sagemaker_endpoint=${{ inputs.enable_sagemaker_endpoint }}"
            -var="enable_sagemaker_training=${{ inputs.enable_sagemaker_training }}"
            -var="enable_eventbridge_monitoring=${{ inputs.enable_eventbridge_monitoring }}"
            -var="sagemaker_instance_type=${{ inputs.sagemaker_instance_type }}"
            -var="model_package_version=${{ inputs.model_package_version }}"
            -var="domain_name=${{ inputs.domain_name }}"
            -var="enable_custom_domain=${{ inputs.enable_custom_domain }}"
            -var="api_subdomain=${{ inputs.api_subdomain }}"
          )
          if [[ -n "${TF_STATE_BUCKET:-}" ]]; then
            EXTRA_ARGS+=(-var="core_state_bucket=${TF_STATE_BUCKET}")
          fi
        fi
        if [[ "${{ inputs.stack }}" == "core" && -n "${{ inputs.domain_name }}" ]]; then
          EXTRA_ARGS+=(-var="domain_name=${{ inputs.domain_name }}")
        fi
        terraform plan -input=false -no-color "${EXTRA_ARGS[@]}"

    - name: Terraform apply
      if: inputs.command == 'apply'
      shell: bash
      working-directory: infra/${{ inputs.stack }}
      run: |
        EXTRA_ARGS=()
        if [[ "${{ inputs.stack }}" == "runtime" ]]; then
          EXTRA_ARGS+=(
            -var="enable_sagemaker_endpoint=${{ inputs.enable_sagemaker_endpoint }}"
            -var="enable_sagemaker_training=${{ inputs.enable_sagemaker_training }}"
            -var="enable_eventbridge_monitoring=${{ inputs.enable_eventbridge_monitoring }}"
            -var="sagemaker_instance_type=${{ inputs.sagemaker_instance_type }}"
            -var="model_package_version=${{ inputs.model_package_version }}"
            -var="domain_name=${{ inputs.domain_name }}"
            -var="enable_custom_domain=${{ inputs.enable_custom_domain }}"
            -var="api_subdomain=${{ inputs.api_subdomain }}"
          )
          if [[ -n "${TF_STATE_BUCKET:-}" ]]; then
            EXTRA_ARGS+=(-var="core_state_bucket=${TF_STATE_BUCKET}")
          fi
        fi
        if [[ "${{ inputs.stack }}" == "core" && -n "${{ inputs.domain_name }}" ]]; then
          EXTRA_ARGS+=(-var="domain_name=${{ inputs.domain_name }}")
        fi
        if [[ "${{ inputs.auto_approve }}" == "true" ]]; then
          terraform apply -input=false -auto-approve "${EXTRA_ARGS[@]}"
        else
          terraform apply -input=false "${EXTRA_ARGS[@]}"
        fi

    - name: Terraform destroy
      if: inputs.command == 'destroy'
      shell: bash
      working-directory: infra/${{ inputs.stack }}
      run: |
        if [[ "${{ inputs.auto_approve }}" == "true" ]]; then
          terraform destroy -input=false -auto-approve
        else
          terraform destroy -input=false
        fi
