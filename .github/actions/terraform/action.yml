name: Terraform
description: Init, fmt, validate, plan, apply, or destroy for absa-mlops-platform

inputs:
  environment:
    description: dev or prod
    required: true
  command:
    description: plan | apply | destroy | fmt-check
    required: true
  auto_approve:
    description: Skip interactive approval for apply/destroy
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false

    - name: Configure AWS credentials
      if: inputs.command != 'fmt-check'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform fmt (check)
      if: inputs.command == 'fmt-check'
      shell: bash
      run: terraform fmt -check -recursive
      working-directory: infrastructure/terraform

    - name: Terraform init
      if: inputs.command != 'fmt-check'
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
      run: |
        set -euo pipefail
        if [[ -z "${TF_STATE_BUCKET:-}" ]]; then
          echo "::error::Secret TF_STATE_BUCKET is not set. Run scripts/bootstrap_tf_state.sh once locally."
          exit 1
        fi
        terraform init -input=false \
          -backend-config="bucket=${TF_STATE_BUCKET}" \
          -backend-config="key=${TF_STATE_KEY:-absa-mlops-platform/${{ inputs.environment }}/terraform.tfstate}" \
          -backend-config="region=${AWS_REGION}" \
          -backend-config="encrypt=true" \
          -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE:-absa-mlops-platform-terraform-lock}"

    - name: Terraform validate
      if: inputs.command != 'fmt-check'
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
      run: terraform validate

    - name: Terraform plan
      if: inputs.command == 'plan'
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
      run: terraform plan -input=false -no-color -out=tfplan

    - name: Terraform apply
      if: inputs.command == 'apply'
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
      run: |
        if [[ "${{ inputs.auto_approve }}" == "true" ]]; then
          terraform apply -input=false -auto-approve
        else
          terraform apply -input=false
        fi

    - name: Terraform destroy
      if: inputs.command == 'destroy'
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
      run: |
        if [[ "${{ inputs.auto_approve }}" == "true" ]]; then
          terraform destroy -input=false -auto-approve
        else
          terraform destroy -input=false
        fi
