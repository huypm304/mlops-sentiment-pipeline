# Build static Next.js export and sync to S3 + CloudFront invalidation.
name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "NEXT_PUBLIC_API_URL (default https://api.minhhuy.me)"
        required: false
        default: "https://api.minhhuy.me"
      use_presign_upload:
        description: Use S3 presign dataset upload flow
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: absa-mlops-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-1
      TF_STATE_BUCKET: absa-mlops-demo-tf-state
      TF_STATE_LOCK_TABLE: absa-mlops-demo-tf-locks
      NEXT_PUBLIC_API_URL: ${{ inputs.api_url }}
      NEXT_PUBLIC_USE_PRESIGN_UPLOAD: ${{ inputs.use_presign_upload && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static export
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Resolve frontend bucket and CloudFront ID
        id: infra
        working-directory: infrastructure/terraform/runtime
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=runtime/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        shell: bash
        run: |
          aws s3 sync frontend/out "s3://${{ steps.infra.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.distribution_id }}" \
            --paths "/*"

      - name: Smoke test frontend
        shell: bash
        run: |
          URL="${{ steps.infra.outputs.frontend_url }}"
          echo "Frontend URL: $URL"
          curl -fsSI "$URL" | head -5
          echo "## Frontend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **frontend_url**: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **api_url**: $NEXT_PUBLIC_API_URL" >> "$GITHUB_STEP_SUMMARY"
