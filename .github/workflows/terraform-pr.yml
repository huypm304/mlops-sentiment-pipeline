# Validate Terraform on pull requests (no apply — safe for forks if secrets omitted).
name: Terraform PR

on:
  pull_request:
    branches: [main, master]
    paths:
      - "infrastructure/**"
      - "lambda/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/actions/terraform/**"

concurrency:
  group: terraform-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform
        with:
          environment: dev
          command: fmt-check

  plan-dev:
    needs: fmt
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
      TF_STATE_KEY: absa-mlops-platform/dev/terraform.tfstate
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform
        with:
          environment: dev
          command: plan
