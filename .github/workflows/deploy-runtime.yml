# Deploy runtime services: Lambda, API Gateway, Step Functions, EventBridge, CloudWatch.
name: Deploy Runtime

on:
  workflow_dispatch:
    inputs:
      auto_approve:
        description: Auto-approve apply
        type: boolean
        default: true
      enable_sagemaker_endpoint:
        description: Enable SageMaker inference endpoint
        type: boolean
        default: false
      enable_sagemaker_training:
        description: Enable SageMaker GPU training (train_kaggle.py, 50 epochs)
        type: boolean
        default: true
      sagemaker_instance_type:
        description: SageMaker endpoint instance type
        type: choice
        options:
          - ml.m5.large
          - ml.m5.xlarge
          - ml.c5.large
          - ml.t3.medium
        default: ml.m5.large
      model_package_version:
        description: Bump when models/production/model.tar.gz changes (forces SageMaker redeploy)
        required: false
        default: "v3"
      enable_eventbridge_monitoring:
        description: Enable EventBridge monitoring schedules
        type: boolean
        default: true
      domain_name:
        description: Root domain
        required: false
        default: "minhhuy.me"
      enable_custom_domain:
        description: Enable custom domain (ACM + CloudFront + API)
        type: boolean
        default: true
      api_subdomain:
        description: API subdomain prefix
        required: false
        default: "api"

permissions:
  contents: read

concurrency:
  group: absa-mlops-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-1
      TF_STATE_BUCKET: absa-mlops-demo-tf-state
      TF_STATE_LOCK_TABLE: absa-mlops-demo-tf-locks
      TF_STATE_KEY: runtime/terraform.tfstate
      TF_VAR_core_state_bucket: absa-mlops-demo-tf-state
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload SageMaker training source
        if: inputs.enable_sagemaker_training == 'true'
        shell: bash
        env:
          ARTIFACTS_BUCKET: absa-mlops-demo-artifacts
          AWS_REGION: ap-southeast-1
        run: bash scripts/build_training_package.sh

      - name: Deploy options
        shell: bash
        run: |
          echo "## Deploy Runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "| Option | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SageMaker endpoint | ${{ inputs.enable_sagemaker_endpoint }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SageMaker training | ${{ inputs.enable_sagemaker_training }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Instance type | ${{ inputs.sagemaker_instance_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Model package | ${{ inputs.model_package_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EventBridge monitoring | ${{ inputs.enable_eventbridge_monitoring }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Domain | ${{ inputs.domain_name }} |" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/terraform-stack
        with:
          stack: runtime
          command: apply
          auto_approve: ${{ inputs.auto_approve }}
          enable_sagemaker_endpoint: ${{ inputs.enable_sagemaker_endpoint }}
          enable_sagemaker_training: ${{ inputs.enable_sagemaker_training }}
          enable_eventbridge_monitoring: ${{ inputs.enable_eventbridge_monitoring }}
          sagemaker_instance_type: ${{ inputs.sagemaker_instance_type }}
          model_package_version: ${{ inputs.model_package_version }}
          domain_name: ${{ inputs.domain_name }}
          enable_custom_domain: ${{ inputs.enable_custom_domain }}
          api_subdomain: ${{ inputs.api_subdomain }}

      - name: Smoke test /health
        working-directory: infra/runtime
        shell: bash
        env:
          TF_STATE_BUCKET: absa-mlops-demo-tf-state
          TF_STATE_LOCK_TABLE: absa-mlops-demo-tf-locks
          AWS_REGION: ap-southeast-1
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=runtime/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
          API_URL=$(terraform output -raw api_url)
          echo "API URL: $API_URL"
          echo "- **api_url**: $API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **step_functions_arn**: $(terraform output -raw step_functions_arn)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **sagemaker_endpoint_enabled**: $(terraform output -raw sagemaker_endpoint_enabled)" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$API_URL/health" | tee /tmp/health.json
          echo "- **health**: $(cat /tmp/health.json)" >> "$GITHUB_STEP_SUMMARY"
          API_CUSTOM=$(terraform output -raw api_custom_domain_url 2>/dev/null || true)
          FRONTEND_URL=$(terraform output -raw frontend_url 2>/dev/null || true)
          if [[ -n "$API_CUSTOM" ]]; then
            echo "- **api_custom_domain_url**: $API_CUSTOM" >> "$GITHUB_STEP_SUMMARY"
            curl -fsS "$API_CUSTOM/health" | tee /tmp/health-custom.json || true
            echo "- **health (custom domain)**: $(cat /tmp/health-custom.json 2>/dev/null || echo skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$FRONTEND_URL" ]]; then
            echo "- **frontend_url**: $FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ inputs.enable_sagemaker_endpoint }}" == "true" ]]; then
            ENDPOINT=$(terraform output -raw sagemaker_endpoint_name)
            echo "Warming SageMaker endpoint: $ENDPOINT"
            bash ../../scripts/warmup_sagemaker_endpoint.sh "$ENDPOINT" || true
            curl -fsS -X POST "$API_URL/predict" \
              -H 'Content-Type: application/json' \
              -d '{"text":"Gia tot nhung giao cham"}' | tee /tmp/predict.json || true
            echo "- **predict smoke**: $(cat /tmp/predict.json 2>/dev/null || echo failed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          NS=$(terraform output -json route53_name_servers 2>/dev/null || echo "[]")
          echo "- **route53_name_servers**: $NS" >> "$GITHUB_STEP_SUMMARY"
