name: PR Validate

on:
  push:
    branches:
      - refactor/terraform-bootstrap-core-runtime
  pull_request:
    branches:
      - refactor/terraform-bootstrap-core-runtime
      - develop
    paths:
      - "infra/**"
      - "apps/backend/lambda/**"
      - "apps/backend/registry/**"
      - "ml/data_processing/**"
      - ".github/**"
      - "apps/frontend/**"

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-stack
        with:
          stack: bootstrap
          command: fmt-check

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, core, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Init and validate ${{ matrix.stack }}
        working-directory: infra/${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
