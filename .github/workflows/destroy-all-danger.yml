# DANGER: destroys runtime then core. Artifact bucket has prevent_destroy and will block unless removed manually.
name: Destroy All (Danger)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY-ALL-ABSA-MLOPS to confirm
        required: true
      auto_approve:
        description: Auto-approve destroy
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: absa-mlops-destroy-all
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == 'DESTROY-ALL-ABSA-MLOPS'
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_VAR_core_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Destroy runtime
        uses: ./.github/actions/terraform-stack
        with:
          stack: runtime
          command: destroy
          auto_approve: ${{ inputs.auto_approve }}
        env:
          TF_STATE_KEY: runtime/terraform.tfstate

      - name: Destroy core
        uses: ./.github/actions/terraform-stack
        with:
          stack: core
          command: destroy
          auto_approve: ${{ inputs.auto_approve }}
        env:
          TF_STATE_KEY: core/terraform.tfstate

      - name: Summary
        shell: bash
        run: |
          echo "## Destroy-all completed (or blocked)" >> "$GITHUB_STEP_SUMMARY"
          echo "Bootstrap (state bucket, OIDC) was NOT destroyed." >> "$GITHUB_STEP_SUMMARY"
          echo "If core destroy failed, the artifact bucket likely has prevent_destroy." >> "$GITHUB_STEP_SUMMARY"
