# Preview runtime Terraform plan (no apply).
name: Plan Runtime

on:
  workflow_dispatch:
    inputs:
      enable_sagemaker_endpoint:
        description: Enable SageMaker inference endpoint
        type: boolean
        default: false
      enable_sagemaker_training:
        description: Enable SageMaker training jobs
        type: boolean
        default: false
      sagemaker_instance_type:
        description: SageMaker endpoint instance type
        type: choice
        options:
          - ml.m5.large
          - ml.m5.xlarge
          - ml.c5.large
          - ml.t3.medium
        default: ml.m5.large
      enable_eventbridge_monitoring:
        description: Enable EventBridge monitoring schedules
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: absa-mlops-runtime-plan
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-1
      TF_STATE_BUCKET: absa-mlops-demo-tf-state
      TF_STATE_LOCK_TABLE: absa-mlops-demo-tf-locks
      TF_STATE_KEY: runtime/terraform.tfstate
      TF_VAR_core_state_bucket: absa-mlops-demo-tf-state
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-stack
        with:
          stack: runtime
          command: plan
          enable_sagemaker_endpoint: ${{ inputs.enable_sagemaker_endpoint }}
          enable_sagemaker_training: ${{ inputs.enable_sagemaker_training }}
          enable_eventbridge_monitoring: ${{ inputs.enable_eventbridge_monitoring }}
          sagemaker_instance_type: ${{ inputs.sagemaker_instance_type }}
          domain_name: minhhuy.me
          enable_custom_domain: true
          api_subdomain: api
