# Preview runtime changes and cost flags before apply. Does NOT modify AWS.
name: Plan Runtime

on:
  workflow_dispatch:
    inputs:
      enable_sagemaker_endpoint:
        description: "COSTLY (~$50+/mo): SageMaker inference endpoint"
        type: choice
        options: ["false", "true"]
        default: "false"
      enable_sagemaker_training:
        description: "COSTLY (~$1–10+/run): Real SageMaker training jobs"
        type: choice
        options: ["false", "true"]
        default: "false"
      sagemaker_instance_type:
        description: SageMaker endpoint instance type
        type: choice
        options:
          - ml.m5.large
          - ml.m5.xlarge
          - ml.c5.large
          - ml.t3.medium
        default: ml.m5.large
      enable_eventbridge_monitoring:
        description: EventBridge monitoring schedules
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

concurrency:
  group: absa-mlops-runtime-plan
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-1
      TF_STATE_BUCKET: absa-mlops-demo-tf-state
      TF_STATE_LOCK_TABLE: absa-mlops-demo-tf-locks
      TF_STATE_KEY: runtime/terraform.tfstate
      TF_VAR_core_state_bucket: absa-mlops-demo-tf-state
    steps:
      - uses: actions/checkout@v4

      - name: Cost preview
        shell: bash
        run: |
          echo "## Plan Runtime — cost flags" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flag | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| enable_sagemaker_endpoint | ${{ inputs.enable_sagemaker_endpoint }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| enable_sagemaker_training | ${{ inputs.enable_sagemaker_training }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sagemaker_instance_type | ${{ inputs.sagemaker_instance_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| enable_eventbridge_monitoring | ${{ inputs.enable_eventbridge_monitoring }} |" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/terraform-stack
        with:
          stack: runtime
          command: plan
          enable_sagemaker_endpoint: ${{ inputs.enable_sagemaker_endpoint }}
          enable_sagemaker_training: ${{ inputs.enable_sagemaker_training }}
          enable_eventbridge_monitoring: ${{ inputs.enable_eventbridge_monitoring }}
          sagemaker_instance_type: ${{ inputs.sagemaker_instance_type }}
          domain_name: minhhuy.me
          enable_custom_domain: true
          api_subdomain: api
