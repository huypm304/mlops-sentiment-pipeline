# One-time per AWS account: creates tf state bucket, lock table, optional budget.
name: Deploy Bootstrap

on:
  workflow_dispatch:
    inputs:
      auto_approve:
        description: Auto-approve apply
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: absa-mlops-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-stack
        with:
          stack: bootstrap
          command: apply
          auto_approve: ${{ inputs.auto_approve }}

      - name: Print outputs
        working-directory: infrastructure/terraform/bootstrap
        shell: bash
        run: |
          echo "## Bootstrap outputs" >> "$GITHUB_STEP_SUMMARY"
          terraform output -json | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'- **{k}**: {v.get(\"value\", v)}')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || terraform output >> "$GITHUB_STEP_SUMMARY"
