# Run from branch: refactor/terraform-bootstrap-core-runtime
# One-time per AWS account: creates tf state bucket, lock table, GitHub OIDC provider, deploy role.
# Requires AWS_ROLE_TO_ASSUME with permissions to create S3, DynamoDB, and IAM OIDC.
# After first apply, switch AWS_ROLE_TO_ASSUME to the github_deploy_role_arn output.
name: Deploy Bootstrap

on:
  workflow_dispatch:
    inputs:
      auto_approve:
        description: Auto-approve apply
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: absa-mlops-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL || '' }}
      TF_VAR_deploy_branches: '["refactor/terraform-bootstrap-core-runtime"]'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-stack
        with:
          stack: bootstrap
          command: apply
          auto_approve: ${{ inputs.auto_approve }}

      - name: Print outputs
        working-directory: infrastructure/terraform/bootstrap
        shell: bash
        run: |
          echo "## Bootstrap outputs" >> "$GITHUB_STEP_SUMMARY"
          terraform output -json | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'- **{k}**: {v.get(\"value\", v)}')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || terraform output >> "$GITHUB_STEP_SUMMARY"
