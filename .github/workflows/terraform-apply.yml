# Manually provision / update AWS infra for testing (dev recommended).
name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - prod
        default: dev
      auto_approve:
        description: Auto-approve apply (required for CI)
        type: boolean
        default: true

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
      TF_STATE_KEY: absa-mlops-platform/${{ inputs.environment }}/terraform.tfstate
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform
        with:
          environment: ${{ inputs.environment }}
          command: apply
          auto_approve: ${{ inputs.auto_approve }}

      - name: Print outputs
        shell: bash
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        run: |
          echo "## Terraform outputs (${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
          terraform output -json | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'- **{k}**: {v.get(\"value\", v)}')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || terraform output >> "$GITHUB_STEP_SUMMARY" || true
