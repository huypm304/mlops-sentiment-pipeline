# Dual-track data: DVC manages official benchmark splits only.
# Run after `dvc pull`:  dvc repro publish

params:
  - datasets/processed/params.yaml

stages:
  publish:
    cmd: >-
      python scripts/publish_approved_dataset.py
      --dataset-id ${dataset_id}
      --name "${dataset_name}"
    deps:
      - datasets/processed/train.jsonl
      - datasets/processed/dev.jsonl
      - datasets/processed/test.jsonl
      - scripts/publish_approved_dataset.py
