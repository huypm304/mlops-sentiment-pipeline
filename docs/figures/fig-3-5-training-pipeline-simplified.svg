<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-label="Quy trinh huan luyen va trien khai mo hinh">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .gate { fill: #fff7ed; stroke: #9a3412; stroke-width: 1.5; }
      .ok { fill: #ecfdf5; stroke: #065f46; stroke-width: 1.5; }
      .fail { fill: #fef2f2; stroke: #991b1b; stroke-width: 1.5; }
      .title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 13px Arial, sans-serif; fill: #0f172a; }
      .sub { font: 11px Arial, sans-serif; fill: #475569; }
      .note { font: 11px Arial, sans-serif; fill: #64748b; }
      .edge { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.3; fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    </style>
  </defs>

  <text x="20" y="28" class="title">Hinh 3.5. Quy trinh huan luyen va trien khai mo hinh</text>
  <text x="20" y="48" class="note">Dieu phoi boi AWS Step Functions (so do rut gon). Chi tiet day du xem Phu luc.</text>

  <rect class="box" x="20" y="90" width="130" height="64" rx="6"/>
  <text x="85" y="116" text-anchor="middle" class="label">1. Training</text>
  <text x="85" y="134" text-anchor="middle" class="sub">StartTraining</text>

  <rect class="box" x="180" y="90" width="130" height="64" rx="6"/>
  <text x="245" y="116" text-anchor="middle" class="label">2. Evaluation</text>
  <text x="245" y="134" text-anchor="middle" class="sub">EvaluateCandidate</text>

  <rect class="box" x="340" y="90" width="130" height="64" rx="6"/>
  <text x="405" y="116" text-anchor="middle" class="label">3. Compare</text>
  <text x="405" y="134" text-anchor="middle" class="sub">CompareToProduction</text>

  <rect class="box" x="500" y="90" width="130" height="64" rx="6"/>
  <text x="565" y="116" text-anchor="middle" class="label">4. Registry</text>
  <text x="565" y="134" text-anchor="middle" class="sub">RegisterCandidate</text>

  <rect class="gate" x="660" y="90" width="140" height="64" rx="6"/>
  <text x="730" y="116" text-anchor="middle" class="label">5. Promote Gate</text>
  <text x="730" y="134" text-anchor="middle" class="sub">TAS-Relaxed F1</text>

  <path class="edge" d="M150 122 H180"/>
  <path class="edge" d="M310 122 H340"/>
  <path class="edge" d="M470 122 H500"/>
  <path class="edge" d="M630 122 H660"/>

  <rect class="ok" x="660" y="200" width="140" height="50" rx="6"/>
  <text x="730" y="230" text-anchor="middle" class="label">6a. Deploy</text>

  <rect class="fail" x="480" y="200" width="140" height="50" rx="6"/>
  <text x="550" y="230" text-anchor="middle" class="label">6b. Reject</text>

  <path class="edge" d="M730 154 V200"/>
  <path class="edge" d="M660 225 H620"/>
  <text x="742" y="180" class="note">promote</text>
  <text x="580" y="190" class="note">khong dat</text>

  <rect class="fail" x="180" y="260" width="290" height="40" rx="6"/>
  <text x="325" y="285" text-anchor="middle" class="label">Notify Failure (loi ky thuat)</text>
  <path class="dash" d="M245 154 V260"/>
</svg>
